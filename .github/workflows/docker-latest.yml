name: Docker Latest

on:
  workflow_dispatch:
  push:
    branches:
      - 1.x

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: yukazaki/coamifee-shop:latest
          cache-from: type=registry,ref=yukazaki/coamifee-shop:buildcache-linux-amd64
          cache-to: type=registry,ref=yukazaki/coamifee-shop:buildcache-linux-amd64,mode=max
          provenance: false
