services:
  app:
    image: "yukazaki/coamifee-shop:latest"
    restart: unless-stopped
    environment:
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set APP_KEY}"
      APP_URL: "${APP_URL:?Set APP_URL}"

      DB_CONNECTION: "pgsql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE:-coamifee}"
      DB_USERNAME: "${DB_USERNAME:-coamifee}"
      DB_PASSWORD: "${DB_PASSWORD:-coamifee}"

      # If you currently use database cache in production, leave this as "database".
      # Recommended for production: redis.
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"

      REDIS_HOST: "redis"
      REDIS_PORT: "6379"

      # Keep startup fast; run migrations via the "migrate" service.
      RUN_MIGRATIONS: "false"
      RUN_OPTIMIZE: "${RUN_OPTIMIZE:-false}"
      RUN_SHIELD_GENERATE: "false"
      RUN_DB_SEED: "false"
      CREATE_ADMIN_USER: "false"

      # If DB might be slow to accept connections.
      DB_WAIT_MAX_SECONDS: "${DB_WAIT_MAX_SECONDS:-60}"
      DB_WAIT_INTERVAL_SECONDS: "${DB_WAIT_INTERVAL_SECONDS:-2}"

    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - "coamifee-storage:/var/www/html/storage"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: "yukazaki/coamifee-shop:latest"
    restart: unless-stopped
    command: "php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600"
    environment:
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set APP_KEY}"
      APP_URL: "${APP_URL:?Set APP_URL}"

      DB_CONNECTION: "pgsql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE:-coamifee}"
      DB_USERNAME: "${DB_USERNAME:-coamifee}"
      DB_PASSWORD: "${DB_PASSWORD:-coamifee}"

      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"

      REDIS_HOST: "redis"
      REDIS_PORT: "6379"

      RUN_MIGRATIONS: "false"
    volumes:
      - "coamifee-storage:/var/www/html/storage"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: "yukazaki/coamifee-shop:latest"
    restart: unless-stopped
    command: "php /var/www/html/artisan schedule:work"
    environment:
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set APP_KEY}"
      APP_URL: "${APP_URL:?Set APP_URL}"

      DB_CONNECTION: "pgsql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE:-coamifee}"
      DB_USERNAME: "${DB_USERNAME:-coamifee}"
      DB_PASSWORD: "${DB_PASSWORD:-coamifee}"

      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"

      REDIS_HOST: "redis"
      REDIS_PORT: "6379"

      RUN_MIGRATIONS: "false"
    volumes:
      - "coamifee-storage:/var/www/html/storage"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-off: run this when deploying a new release.
  # docker compose -f docker/docker-compose.production.yml run --rm migrate
  migrate:
    image: "yukazaki/coamifee-shop:latest"
    command: "php /var/www/html/artisan migrate --force --no-interaction"
    environment:
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set APP_KEY}"
      APP_URL: "${APP_URL:?Set APP_URL}"

      DB_CONNECTION: "pgsql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE:-coamifee}"
      DB_USERNAME: "${DB_USERNAME:-coamifee}"
      DB_PASSWORD: "${DB_PASSWORD:-coamifee}"

      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"

      REDIS_HOST: "redis"
      REDIS_PORT: "6379"

      DB_WAIT_MAX_SECONDS: "${DB_WAIT_MAX_SECONDS:-60}"
      DB_WAIT_INTERVAL_SECONDS: "${DB_WAIT_INTERVAL_SECONDS:-2}"
    volumes:
      - "coamifee-storage:/var/www/html/storage"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-coamifee}"
      POSTGRES_USER: "${DB_USERNAME:-coamifee}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-coamifee}"
    volumes:
      - "coamifee-postgres:/var/lib/postgresql/data"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-coamifee} -d ${DB_DATABASE:-coamifee}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - "coamifee-redis:/data"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coamifee-storage:
  coamifee-postgres:
  coamifee-redis:
